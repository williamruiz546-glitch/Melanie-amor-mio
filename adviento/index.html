<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adviento para Melancho</title>
<meta name="description" content="Un calendario de adviento hecho con todo mi amor para Melancho.">
<meta name="theme-color" content="#140c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adviento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ====== BIENVENIDA ====== -->
<section class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="splashTitle">
  <div class="splash-inner">
    <div class="splash-seal" aria-hidden="true">
      <svg viewBox="0 0 100 100"><path d="M50 82C22 62 12 46 12 33a17 17 0 0 1 38-9 17 17 0 0 1 38 9c0 13-10 29-38 49z"/></svg>
    </div>
    <p class="splash-pre">Para Melancho,</p>
    <h1 class="splash-title" id="splashTitle">con todo mi amor</h1>
    <p class="splash-sub">24 puertitas, una por cada día hasta Navidad</p>
    <button class="btn-gold" id="enterBtn" type="button">Abrir mi calendario</button>
  </div>
</section>

<!-- ====== BARRA SUPERIOR ====== -->
<div class="topbar">
  <button class="icon-btn" id="musicBtn" type="button" aria-pressed="false" aria-label="Encender música navideña">
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
  </button>
</div>

<main id="app" aria-hidden="true">
  <div class="garland" aria-hidden="true">
    <svg class="wire" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 6 Q100 38 200 10 T400 6"/></svg>
    <div class="bulbs" id="bulbs"></div>
  </div>

  <header class="hero">
    <p class="eyebrow">Diciembre 2026</p>
    <h1>Nuestro Adviento,<br><span>mi Melancho</span></h1>
    <p class="sub">Una puertita cada día hasta Navidad</p>
    <div id="testBadge"></div>

    <div class="countdown" id="countdown" aria-live="off">
      <p class="cd-label" id="cdLabel">Faltan para Navidad</p>
      <div class="cd-tiles" id="cdTiles">
        <div class="cd-tile"><b id="cdD">--</b><span>días</span></div>
        <div class="cd-tile"><b id="cdH">--</b><span>horas</span></div>
        <div class="cd-tile"><b id="cdM">--</b><span>min</span></div>
        <div class="cd-tile"><b id="cdS">--</b><span>seg</span></div>
      </div>
      <p class="cd-note" id="count"></p>
    </div>

    <div class="progress" aria-label="Progreso">
      <p class="progress-text" id="progressText">Has abierto 0 de 24 puertitas</p>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0" id="progressBar"><i id="progressFill"></i></div>
    </div>
  </header>

  <section class="grid" id="grid" aria-label="Puertitas del calendario"></section>

  <footer class="foot">
    <svg class="pines" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 60 L20 30 L30 38 L45 12 L60 36 L70 28 L88 60Z M70 60 L95 20 L105 30 L120 4 L136 30 L146 22 L170 60Z M150 60 L172 34 L184 42 L200 16 L216 42 L228 34 L250 60Z M230 60 L255 22 L265 32 L282 6 L298 32 L308 24 L330 60Z M312 60 L330 36 L342 44 L358 18 L374 44 L384 36 L400 60Z"/>
    </svg>
    <p>Hecho con todo mi amor por tu flaquito ❤️</p>
  </footer>
</main>

<!-- ====== VENTANA DE CONTENIDO ====== -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="stage" id="stage" role="dialog" aria-modal="true" aria-labelledby="cardTitle" tabindex="-1"></div>
</div>

<div class="flash" id="flash" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="js/music.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
